<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TripTalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/trip.css">
  <style>
    .trip-onboard { max-width: 460px; margin: 0 auto; padding: 32px 20px; text-align: center; }
    .trip-flag { font-size: 64px; line-height: 1; }
    .trip-onboard h1 { margin: 12px 0 6px; }
    .trip-sub { color: var(--muted, #77736c); margin: 0 0 24px; }
    .trip-label { display: block; text-align: left; font-weight: 700; margin: 18px 0 8px; }
    .trip-input { width: 100%; padding: 13px; font-size: 1.1rem; border-radius: 12px;
      border: 1px solid rgba(127,127,127,.35); background: rgba(127,127,127,.06); color: inherit; }
    .trip-choices { display: flex; flex-direction: column; gap: 10px; }
    .trip-choice { display: flex; flex-direction: column; align-items: flex-start; text-align: left;
      border: 1px solid rgba(127,127,127,.3); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
    .trip-choice input { margin-right: 8px; }
    .trip-choice span { color: var(--muted, #77736c); font-size: .85rem; }
    .trip-choice b { font-weight: 700; }
    .btn.wide.big { font-size: 1.15rem; padding: 16px; margin-top: 22px; }
    .trip-fine { color: var(--muted, #77736c); font-size: .82rem; margin-top: 10px; }

    .trip-dash { max-width: 460px; margin: 0 auto; padding: 16px 20px 40px; }
    .trip-top { display: flex; justify-content: space-between; align-items: center; }
    .trip-flag-sm { font-size: 32px; }
    .trip-settings { background: none; border: none; font-size: 22px; cursor: pointer; }
    .countdown { text-align: center; margin: 8px 0 20px; }
    .count-num { font-size: 84px; font-weight: 800; line-height: 1; }
    .count-label { color: var(--muted, #77736c); font-size: 1rem; margin-top: 2px; }
    .done-today { text-align: center; background: rgba(46,158,91,.14); border-radius: 12px;
      padding: 14px; font-weight: 600; margin-bottom: 12px; }
    .mod-list { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
    .mod-row { display: flex; align-items: center; gap: 12px; }
    .mod-name { flex: 0 0 46%; font-size: .9rem; }
    .mod-bar { flex: 1; height: 9px; border-radius: 6px; background: rgba(127,127,127,.2); overflow: hidden; }
    .mod-bar span { display: block; height: 100%; background: #2e9e5b; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/trip-app.js"></script>
</body>
</html>
